<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="fediverse:creator" content="@keepur@infosec.exchange">
  <title>CVE Keeper</title>

  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f1620;
      --text:#e6edf3;
      --muted:#9fb0c0;
      --border:#223043;
      --link:#7cc7ff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:var(--bg);
      color:var(--text);
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    header, footer{
      background:rgba(15,22,32,.92);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    footer{border-top:1px solid var(--border); border-bottom:none;}

    .bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 16px;
    }

    /* Title + subtitle */
    .title-wrap{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .title{
      font-weight:700;
      letter-spacing:.2px;
      font-size:18px;
    }
    .subtitle{
      font-size:13px;
      font-style:italic;
      color:var(--muted);
      text-decoration:none;
    }
    .subtitle:hover{
      color:var(--link);
      text-decoration:underline;
    }

    .right{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:320px;
      justify-content:flex-end;
    }

    /* MAIN: scrollable content */
    main{
      flex:1;
      min-height:0;
      padding:12px;
      overflow:auto;
    }

    .doc-stack{
      display:flex;
      flex-direction:column;
      gap:12px;
      width:100%;
    }

    .panel{
      width:100%;
      border:1px solid var(--border);
      border-radius:10px;
      overflow:hidden;
      background:var(--panel);
    }

    /* Poster */
    .poster-wrap{ padding:12px; }
    .poster-title{
      font-size:13px;
      color:var(--muted);
      margin:0 0 10px 0;
    }
    .poster-img{
      width:100%;
      height:auto;
      display:block;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--panel);
    }

    /* Audio */
    .audio-card{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:10px;
      background:rgba(11,15,20,.7);
      cursor:grab;
      user-select:none;
      touch-action:none;
      max-width:760px;
    }
    .audio-card:active{cursor:grabbing}

    #playBtn{
      appearance:none;
      background:#e53935;
      border:1px solid #ff6f60;
      color:#fff;
      font-size:15px;
      font-weight:800;
      padding:10px 18px;
      border-radius:12px;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(229,57,53,0.35);
      transition: transform .2s ease, box-shadow .2s ease;
      flex:0 0 auto;
    }
    #playBtn:hover{ box-shadow:0 8px 22px rgba(229,57,53,.45); }
    #playBtn:active{ transform:scale(.97); }
    #playBtn:focus{
      outline:2px solid rgba(124,199,255,.6);
      outline-offset:2px;
    }

    #seek{
      flex:1 1 260px;
      min-width:160px;
      height:6px;
      accent-color:#e53935;
      cursor:pointer;
    }
    #seek:disabled{ cursor:not-allowed; opacity:.6; }

    .metrics{
      font-variant-numeric:tabular-nums;
      color:var(--muted);
      font-size:12px;
      min-width:140px;
      text-align:right;
      flex:0 0 auto;
    }

    .audio-meta{
      display:flex;
      flex-direction:column;
      gap:2px;
      flex:0 0 auto;
      min-width:120px;
      max-width:160px;
    }
    .audio-meta .label{
      color:var(--muted);
      font-size:12px;
      line-height:1.1;
    }
    .audio-meta a{
      color:var(--link);
      font-size:12px;
      text-decoration:none;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .audio-meta a:hover{ text-decoration:underline; }

    /* PDF secondary scrollbar (true full-length, because pages are in DOM) */
    .panel.pdf-panel{
      overflow:visible;
      display:flex;
      flex-direction:column;
    }
    .pdf-scroll{
      height:calc(100vh - 190px);
      min-height:640px;
      overflow:auto;      /* SECOND scrollbar */
      padding:12px;
    }

    .pdf-status{
      color:var(--muted);
      font-size:13px;
      margin:0 0 10px 0;
    }

    .pdf-pages{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .pdf-page{
      border:1px solid var(--border);
      border-radius:10px;
      background:rgba(11,15,20,.55);
      padding:10px;
    }

    .pdf-page canvas{
      width:100%;
      height:auto;
      display:block;
      border-radius:8px;
      background:var(--panel);
    }

    .pdf-page .page-label{
      margin:0 0 8px 2px;
      font-size:12px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }

    .footer-left{
      color:var(--muted);
      font-size:12px;
      line-height:1.3;
      max-width:70ch;
    }
    .footer-right{
      display:flex;
      gap:14px;
      font-size:13px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    a{color:var(--link); text-decoration:none}
    a:hover{text-decoration:underline}

    @media (max-width:820px){
      .bar{flex-direction:column; align-items:flex-start}
      .right{min-width:unset; width:100%; justify-content:space-between}
      .metrics{text-align:left}
      .audio-card{width:100%; max-width:100%}
      main{padding:10px}
      .pdf-scroll{height:70vh; min-height:520px}
      .audio-meta{max-width:unset; min-width:unset}
      .audio-meta a{max-width:unset}
    }
  </style>
</head>

<body>
<header>
  <div class="bar">
    <div class="title-wrap">
      <div class="title">CVE Keeper</div>
      <a
        class="subtitle"
        href="https://github.com/keerthanap8898/CveToad"
        target="_blank"
        rel="noopener noreferrer"
      >Repo : github.com/keerthanap8898/CveToad</a>
    </div>

    <div class="right">
      <div id="audioCard" class="audio-card" title="Drag to reposition">
        <button id="playBtn" type="button">Play</button>

        <audio id="audio" preload="metadata" style="display:none">
          <source src="https://raw.githubusercontent.com/keerthanap8898/CveToad/main/Audio_CVEkeeper.mp3" type="audio/mpeg">
        </audio>

        <div class="audio-meta">
          <div class="label">Audio: CVE Keeper</div>
          <a
            href="https://drive.google.com/file/d/1dMqkAuhqUnD5cqcnMaQBtGmGgBXhJIOJ/view?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            title="Open audio in Google Drive"
          >Google Drive</a>
        </div>

        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek audio" disabled>
        <div id="metrics" class="metrics">00:00 / 00:00</div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="doc-stack">

    <!-- PDF -->
    <div class="panel pdf-panel">
      <div class="pdf-scroll" id="pdfScroll">
        <p class="pdf-status" id="pdfStatus">Loading PDF…</p>
        <div class="pdf-pages" id="pdfPages"></div>
      </div>
    </div>

    <!-- Poster -->
    <div class="panel poster-wrap">
      <p class="poster-title">Poster</p>
      <img
        class="poster-img"
        loading="lazy"
        alt="CVE Keeper Poster"
        src="https://raw.githubusercontent.com/keerthanap8898/CveToad/main/CVEkeeper_Poster.png">
    </div>

  </div>
</main>

<footer>
  <div class="bar">
    <div class="footer-left">

    </div>
    <div class="footer-right">
      <a href="https://github.com/keerthanap8898" target="_blank" rel="noopener noreferrer">Github</a>
      <a href="https://linkedin.com/in/keerthanapurushotham" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://infosec.exchange/@keepur" target="_blank" rel="me noopener noreferrer">Mastodon (Infosec)</a>
    </div>
  </div>
</footer>

<script>
  // Audio logic (unchanged)
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const metrics = document.getElementById('metrics');
  const seek = document.getElementById('seek');

  function fmt(t){
    if (!isFinite(t)) return "00:00";
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
  }

  function updateMetrics(){
    metrics.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
  }

  let isSeeking = false;

  function syncSeek(){
    if (!isFinite(audio.duration) || audio.duration <= 0) {
      seek.value = 0;
      seek.disabled = true;
      return;
    }
    seek.disabled = false;
    if (!isSeeking) {
      seek.value = (audio.currentTime / audio.duration) * 100;
    }
  }

  playBtn.addEventListener('click', async () => {
    if (audio.paused) {
      try { await audio.play(); } catch(e) {}
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', () => playBtn.textContent = 'Pause');
  audio.addEventListener('pause', () => playBtn.textContent = 'Play');

  audio.addEventListener('timeupdate', () => {
    updateMetrics();
    syncSeek();
  });
  audio.addEventListener('loadedmetadata', () => {
    updateMetrics();
    syncSeek();
  });
  audio.addEventListener('durationchange', () => {
    updateMetrics();
    syncSeek();
  });

  function seekToPercent(pct){
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    const clamped = Math.max(0, Math.min(100, pct));
    audio.currentTime = (clamped / 100) * audio.duration;
    updateMetrics();
    syncSeek();
  }

  seek.addEventListener('input', (e) => {
    isSeeking = true;
    seekToPercent(Number(e.target.value));
  });

  seek.addEventListener('change', () => { isSeeking = false; });
  seek.addEventListener('pointerup', () => { isSeeking = false; });
  seek.addEventListener('keyup', () => { isSeeking = false; });

  setTimeout(async () => {
    try { await audio.play(); } catch(e) {}
  }, 3000);

  setInterval(() => {
    if (audio.paused) {
      playBtn.classList.remove('play-wobble');
      void playBtn.offsetWidth;
      playBtn.classList.add('play-wobble');
    }
  }, 3000);

  // Drag-to-reposition audio card (unchanged)
  const card = document.getElementById('audioCard');
  let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;

  function ensurePositionable(){
    if (getComputedStyle(card).position !== 'fixed') {
      const rect = card.getBoundingClientRect();
      card.style.position = 'fixed';
      card.style.top = rect.top + 'px';
      card.style.left = rect.left + 'px';
      card.style.zIndex = 9999;
    }
  }

  function onDown(e){
    if (e.target && (e.target.id === 'playBtn' || e.target.id === 'seek' || e.target.tagName === 'A')) return;

    dragging = true;
    ensurePositionable();

    const p = ('touches' in e) ? e.touches[0] : e;
    startX = p.clientX;
    startY = p.clientY;

    const rect = card.getBoundingClientRect();
    origX = rect.left;
    origY = rect.top;

    e.preventDefault();
  }

  function onMove(e){
    if (!dragging) return;
    const p = ('touches' in e) ? e.touches[0] : e;
    const dx = p.clientX - startX;
    const dy = p.clientY - startY;

    const rect = card.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const x = Math.min(Math.max(origX + dx, 8), window.innerWidth - w - 8);
    const y = Math.min(Math.max(origY + dy, 8), window.innerHeight - h - 8);

    card.style.left = x + 'px';
    card.style.top  = y + 'px';
  }

  function onUp(){ dragging = false; }

  card.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);

  card.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp);
</script>

<!-- PDF.js rendering (true full-length scroll) -->
<script type="module">
  import * as pdfjsLib from "https://unpkg.com/pdfjs-dist@5.4.449/build/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://unpkg.com/pdfjs-dist@5.4.449/build/pdf.worker.min.mjs";

  const PDF_URL =
    "https://raw.githubusercontent.com/keerthanap8898/CveToad/main/CVEkeeper_CVEtoad_final.pdf";

  const statusEl = document.getElementById("pdfStatus");
  const pagesEl = document.getElementById("pdfPages");
  const scrollEl = document.getElementById("pdfScroll");

  function pageScaleToFit(page){
    const base = page.getViewport({ scale: 1 });
    const padding = 24; // pdf-scroll padding left+right approx
    const target = Math.max(320, scrollEl.clientWidth - padding);
    return target / base.width;
  }

  async function renderAll(){
    pagesEl.innerHTML = "";
    statusEl.textContent = "Loading PDF…";

    const loadingTask = pdfjsLib.getDocument({ url: PDF_URL });
    const pdf = await loadingTask.promise;

    const total = pdf.numPages;
    statusEl.textContent = `Rendering ${total} pages…`;

    for (let i = 1; i <= total; i++){
      const page = await pdf.getPage(i);

      const wrapper = document.createElement("div");
      wrapper.className = "pdf-page";

      const label = document.createElement("p");
      label.className = "page-label";
      label.textContent = `Page ${i} / ${total}`;
      wrapper.appendChild(label);

      const canvas = document.createElement("canvas");
      wrapper.appendChild(canvas);
      pagesEl.appendChild(wrapper);

      const scale = pageScaleToFit(page);
      const viewport = page.getViewport({ scale });

      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = `${Math.floor(viewport.width)}px`;
      canvas.style.height = `${Math.floor(viewport.height)}px`;

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    statusEl.textContent = "";
  }

  // Initial render
  renderAll().catch(err => {
    statusEl.textContent = "Failed to load PDF.";
    console.error(err);
  });

  // Re-render on resize (debounced) so width stays correct
  let t;
  window.addEventListener("resize", () => {
    clearTimeout(t);
    t = setTimeout(() => renderAll().catch(console.error), 250);
  });
</script>

</body>
