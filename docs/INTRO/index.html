<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="fediverse:creator" content="@keepur@infosec.exchange">
  <title>CVE Keeper</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f1620;
      --text:#e6edf3;
      --muted:#9fb0c0;
      --border:#223043;
      --link:#7cc7ff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:var(--bg);
      color:var(--text);
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    header, footer{
      background:rgba(15,22,32,.92);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    footer{border-top:1px solid var(--border); border-bottom:none;}

    .bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 16px;
    }
    .title{
      font-weight:700;
      letter-spacing:.2px;
      font-size:18px;
    }
    .right{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:320px;
      justify-content:flex-end;
    }

    /* MAIN: scrollable content */
    main{
      flex:1;
      min-height:0;
      padding:12px;
      overflow:auto;
    }

    .doc-stack{
      display:flex;
      flex-direction:column;
      gap:12px;
      width:100%;
    }

    .panel{
      width:100%;
      border:1px solid var(--border);
      border-radius:10px;
      overflow:hidden;
      background:var(--panel);
    }

    /* PDF viewport */
    .panel iframe{
      width:100%;
      border:0;
      background:var(--panel);
      height: calc(100vh - 190px); /* header+footer allowance */
      min-height: 640px;
    }

    /* Poster area */
    .poster-wrap{
      padding:12px;
    }
    .poster-title{
      font-size:13px;
      color:var(--muted);
      margin:0 0 10px 0;
    }
    .poster-img{
      width:100%;
      height:auto;
      display:block;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--panel);
    }

    .audio-card{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:10px;
      background:rgba(11,15,20,.7);
      cursor:grab;
      user-select:none;
      touch-action:none;
      max-width:720px;
    }
    .audio-card:active{cursor:grabbing}

    /* Large red play button */
    #playBtn{
      appearance:none;
      background:#e53935;
      border:1px solid #ff6f60;
      color:#fff;
      font-size:15px;
      font-weight:800;
      padding:10px 18px;
      border-radius:12px;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(229,57,53,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      flex: 0 0 auto;
    }
    #playBtn:hover{ box-shadow:0 8px 22px rgba(229,57,53,0.45); }
    #playBtn:active{ transform: scale(0.97); }
    #playBtn:focus{
      outline:2px solid rgba(124,199,255,.6);
      outline-offset:2px;
    }

    /* Seek/progress bar */
    #seek{
      flex: 1 1 220px;
      min-width: 140px;
      height: 6px;
      accent-color: #e53935;
      cursor: pointer;
    }
    #seek:disabled{
      cursor: not-allowed;
      opacity: .6;
    }

    /* Wobble animation */
    @keyframes play-wobble {
      0%   { transform: rotate(0deg); }
      15%  { transform: rotate(-3deg); }
      30%  { transform: rotate(3deg); }
      45%  { transform: rotate(-2deg); }
      60%  { transform: rotate(2deg); }
      75%  { transform: rotate(-1deg); }
      100% { transform: rotate(0deg); }
    }
    .play-wobble{ animation: play-wobble 0.6s ease-in-out; }

    .metrics{
      font-variant-numeric: tabular-nums;
      color:var(--muted);
      font-size:12px;
      min-width:140px;
      text-align:right;
      flex: 0 0 auto;
    }

    .footer-left{
      color:var(--muted);
      font-size:12px;
      line-height:1.3;
      max-width:70ch;
    }
    .footer-right{
      display:flex;
      gap:14px;
      font-size:13px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    a{color:var(--link); text-decoration:none}
    a:hover{text-decoration:underline}

    @media (max-width: 820px){
      .bar{flex-direction:column; align-items:flex-start}
      .right{min-width:unset; width:100%; justify-content:space-between}
      .metrics{text-align:left}
      .audio-card{width:100%; max-width:100%}
      main{padding:10px}
      .panel iframe{ height: 70vh; min-height: 520px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="bar">
      <div class="title">CVE Keeper</div>

      <div class="right">
        <div id="audioCard" class="audio-card" title="Drag to reposition">
          <button id="playBtn" type="button">Play</button>
          <audio id="audio" preload="metadata" controls style="display:none">
            <source src="https://raw.githubusercontent.com/keerthanap8898/CveToad/main/Audio_CVEkeeper.mp3" type="audio/mpeg">
          </audio>

          <div style="flex:0 0 auto; min-width:110px; color:var(--muted); font-size:12px;">
            Audio:
          </div>

          <input
            id="seek"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
            aria-label="Seek audio"
            disabled
          >

          <div id="metrics" class="metrics">00:00 / 00:00</div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="doc-stack">
      <!-- PDF first -->
      <div class="panel">
        <iframe
          title="CVE Keeper Document"
          src="https://drive.google.com/viewerng/viewer?embedded=true&url=https://raw.githubusercontent.com/keerthanap8898/CveToad/main/CVEkeeper_CVEtoad_final.pdf">
        </iframe>
      </div>

      <!-- Poster image at the end -->
      <div class="panel poster-wrap">
        <p class="poster-title">Poster</p>
        <img
          class="poster-img"
          alt="CVE Keeper Poster"
          src="https://raw.githubusercontent.com/keerthanap8898/CveToad/main/CVEkeeper_Poster.png">
      </div>
    </div>
  </main>

  <footer>
    <div class="bar">
      <div class="footer-left">
        Copyright (C) 2025&nbsp; Keerthana Purushotham &lt;keep.consult@proton.me&gt;.<br/>
        Licensed under the GNU AGPL v3. See LICENSE for details.
      </div>
      <div class="footer-right">
        <a href="https://github.com/keerthanap8898" target="_blank" rel="noopener noreferrer">Github</a>
        <a href="https://linkedin.com/in/keerthanapurushotham" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://infosec.exchange/@keepur" target="_blank" rel="me noopener noreferrer">Mastodon (Infosec)</a>
      </div>
    </div>
  </footer>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const metrics = document.getElementById('metrics');
    const seek = document.getElementById('seek');

    function fmt(t){
      if (!isFinite(t)) return "00:00";
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
    }

    function updateMetrics(){
      metrics.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
    }

    let isSeeking = false;

    function syncSeek(){
      if (!isFinite(audio.duration) || audio.duration <= 0) {
        seek.value = 0;
        seek.disabled = true;
        return;
      }
      seek.disabled = false;
      if (!isSeeking) {
        seek.value = (audio.currentTime / audio.duration) * 100;
      }
    }

    playBtn.addEventListener('click', async () => {
      if (audio.paused) {
        try { await audio.play(); } catch(e) {}
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => playBtn.textContent = 'Pause');
    audio.addEventListener('pause', () => playBtn.textContent = 'Play');

    audio.addEventListener('timeupdate', () => {
      updateMetrics();
      syncSeek();
    });
    audio.addEventListener('loadedmetadata', () => {
      updateMetrics();
      syncSeek();
    });
    audio.addEventListener('durationchange', () => {
      updateMetrics();
      syncSeek();
    });

    // Seek bar interaction
    seek.addEventListener('pointerdown', () => { isSeeking = true; });
    seek.addEventListener('pointerup', (e) => {
      isSeeking = false;
      if (isFinite(audio.duration) && audio.duration > 0) {
        const pct = Number(e.target.value) / 100;
        audio.currentTime = pct * audio.duration;
      }
    });
    seek.addEventListener('input', (e) => {
      if (isFinite(audio.duration) && audio.duration > 0) {
        const pct = Number(e.target.value) / 100;
        audio.currentTime = pct * audio.duration;
        updateMetrics();
      }
    });

    // Autoplay after 3 seconds (may be blocked by browser policy if not interacted)
    setTimeout(async () => {
      try { await audio.play(); } catch(e) {}
    }, 3000);

    // Wobble play button every 3 seconds when paused
    setInterval(() => {
      if (audio.paused) {
        playBtn.classList.remove('play-wobble');
        void playBtn.offsetWidth;
        playBtn.classList.add('play-wobble');
      }
    }, 3000);

    // Click-and-drag audio card (reposition within viewport)
    const card = document.getElementById('audioCard');
    let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;

    function ensurePositionable(){
      if (getComputedStyle(card).position !== 'fixed') {
        const rect = card.getBoundingClientRect();
        card.style.position = 'fixed';
        card.style.top = rect.top + 'px';
        card.style.left = rect.left + 'px';
        card.style.zIndex = 9999;
      }
    }

    function onDown(e){
      // allow interacting with play button and seek bar without dragging
      if (e.target && (e.target.id === 'playBtn' || e.target.id === 'seek')) return;

      dragging = true;
      ensurePositionable();

      const p = ('touches' in e) ? e.touches[0] : e;
      startX = p.clientX;
      startY = p.clientY;

      const rect = card.getBoundingClientRect();
      origX = rect.left;
      origY = rect.top;

      e.preventDefault();
    }

    function onMove(e){
      if (!dragging) return;
      const p = ('touches' in e) ? e.touches[0] : e;
      const dx = p.clientX - startX;
      const dy = p.clientY - startY;

      const rect = card.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      const x = Math.min(Math.max(origX + dx, 8), window.innerWidth - w - 8);
      const y = Math.min(Math.max(origY + dy, 8), window.innerHeight - h - 8);

      card.style.left = x + 'px';
      card.style.top  = y + 'px';
    }

    function onUp(){ dragging = false; }

    card.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);

    card.addEventListener('touchstart', onDown, {passive:false});
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('touchend', onUp);
  </script>
</body>
</html>
