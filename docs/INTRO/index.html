<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="fediverse:creator" content="@keepur@infosec.exchange">
  <title>CVE Keeper</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f1620;
      --text:#e6edf3;
      --muted:#9fb0c0;
      --border:#223043;
      --link:#7cc7ff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:var(--bg);
      color:var(--text);
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    header, footer{
      background:rgba(15,22,32,.92);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    footer{border-top:1px solid var(--border); border-bottom:none;}

    .bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 16px;
    }

    /* Title + subtitle */
    .title-wrap{
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .title{
      font-weight:700;
      letter-spacing:.2px;
      font-size:18px;
    }
    .subtitle{
      font-size:13px;
      font-style:italic;
      color:var(--muted);
      text-decoration:none;
    }
    .subtitle:hover{
      color:var(--link);
      text-decoration:underline;
    }

    .right{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:320px;
      justify-content:flex-end;
    }

    /* MAIN: scrollable content */
    main{
      flex:1;
      min-height:0;
      padding:12px;
      overflow:auto;
    }

    .doc-stack{
      display:flex;
      flex-direction:column;
      gap:12px;
      width:100%;
    }

    .panel{
      width:100%;
      border:1px solid var(--border);
      border-radius:10px;
      overflow:hidden;
      background:var(--panel);
    }

    /* Poster */
    .poster-wrap{ padding:12px; }
    .poster-title{
      font-size:13px;
      color:var(--muted);
      margin:0 0 10px 0;
    }
    .poster-img{
      width:100%;
      height:auto;
      display:block;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--panel);
    }

    /* Audio */
    .audio-card{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:10px;
      background:rgba(11,15,20,.7);
      cursor:grab;
      user-select:none;
      touch-action:none;
      max-width:760px;
    }
    .audio-card:active{cursor:grabbing}

    #playBtn{
      appearance:none;
      background:#e53935;
      border:1px solid #ff6f60;
      color:#fff;
      font-size:15px;
      font-weight:800;
      padding:10px 18px;
      border-radius:12px;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(229,57,53,0.35);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    #playBtn:hover{ box-shadow:0 8px 22px rgba(229,57,53,.45); }
    #playBtn:active{ transform:scale(.97); }
    #playBtn:focus{
      outline:2px solid rgba(124,199,255,.6);
      outline-offset:2px;
    }

    #seek{
      flex:1 1 260px;
      min-width:160px;
      height:6px;
      accent-color:#e53935;
      cursor:pointer;
    }
    #seek:disabled{ cursor:not-allowed; opacity:.6; }

    .metrics{
      font-variant-numeric:tabular-nums;
      color:var(--muted);
      font-size:12px;
      min-width:140px;
      text-align:right;
    }

    .audio-meta{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:120px;
      max-width:160px;
    }
    .audio-meta .label{
      color:var(--muted);
      font-size:12px;
      line-height:1.1;
    }
    .audio-meta a{
      color:var(--link);
      font-size:12px;
      text-decoration:none;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .audio-meta a:hover{ text-decoration:underline; }

    /* PDF secondary scrollbar */
    .panel.pdf-panel{
      overflow:visible;
      display:flex;
      flex-direction:column;
    }
    .pdf-scroll{
      height:calc(100vh - 190px);
      min-height:640px;
      overflow-y:auto;
      overflow-x:hidden;
    }
    .pdf-scroll iframe{
      width:100%;
      height:100%;
      border:0;
      background:var(--panel);
    }

    .footer-left{
      color:var(--muted);
      font-size:12px;
      line-height:1.3;
      max-width:70ch;
    }
    .footer-right{
      display:flex;
      gap:14px;
      font-size:13px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    a{color:var(--link); text-decoration:none}
    a:hover{text-decoration:underline}

    @media (max-width:820px){
      .bar{flex-direction:column; align-items:flex-start}
      .right{min-width:unset; width:100%; justify-content:space-between}
      .metrics{text-align:left}
      .audio-card{width:100%; max-width:100%}
      main{padding:10px}
      .pdf-scroll{height:70vh; min-height:520px}
    }
  </style>
</head>
<body>

<header>
  <div class="bar">
    <div class="title-wrap">
      <div class="title">CVE Keeper</div>
      <a
        class="subtitle"
        href="https://github.com/keerthanap8898/CveToad"
        target="_blank"
        rel="noopener noreferrer"
      >
        CveToad
      </a>
    </div>

    <div class="right">
      <div id="audioCard" class="audio-card">
        <button id="playBtn" type="button">Play</button>
        <audio id="audio" preload="metadata" style="display:none">
          <source src="https://raw.githubusercontent.com/keerthanap8898/CveToad/main/Audio_CVEkeeper.mp3" type="audio/mpeg">
        </audio>

        <div class="audio-meta">
          <div class="label">Audio: CVE Keeper</div>
          <a
            href="https://drive.google.com/file/d/1dMqkAuhqUnD5cqcnMaQBtGmGgBXhJIOJ/view"
            target="_blank"
            rel="noopener noreferrer"
          >Google Drive</a>
        </div>

        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" disabled>
        <div id="metrics" class="metrics">00:00 / 00:00</div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="doc-stack">
    <div class="panel pdf-panel">
      <div class="pdf-scroll">
        <iframe
          title="CVE Keeper Document"
          src="https://drive.google.com/viewerng/viewer?embedded=true&url=https://raw.githubusercontent.com/keerthanap8898/CveToad/main/CVEkeeper_CVEtoad_final.pdf">
        </iframe>
      </div>
    </div>

    <div class="panel poster-wrap">
      <p class="poster-title">Poster</p>
      <img
        class="poster-img"
        loading="lazy"
        alt="CVE Keeper Poster"
        src="https://raw.githubusercontent.com/keerthanap8898/CveToad/main/CVEkeeper_Poster.png">
    </div>
  </div>
</main>

<footer>
  <div class="bar">
    <div class="footer-left">
      Copyright (C) 2025 Keerthana Purushotham &lt;keep.consult@proton.me&gt;.<br>
      Licensed under the GNU AGPL v3.
    </div>
    <div class="footer-right">
      <a href="https://github.com/keerthanap8898" target="_blank" rel="noopener noreferrer">Github</a>
      <a href="https://linkedin.com/in/keerthanapurushotham" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://infosec.exchange/@keepur" target="_blank" rel="me noopener noreferrer">Mastodon</a>
    </div>
  </div>
</footer>

<script>
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const metrics = document.getElementById('metrics');
  const seek = document.getElementById('seek');

  const fmt = t =>
    !isFinite(t) ? "00:00" :
    String(Math.floor(t/60)).padStart(2,'0') + ":" +
    String(Math.floor(t%60)).padStart(2,'0');

  const update = () =>
    metrics.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;

  let seeking = false;

  playBtn.onclick = async () =>
    audio.paused ? audio.play().catch(()=>{}) : audio.pause();

  audio.onplay  = () => playBtn.textContent = "Pause";
  audio.onpause = () => playBtn.textContent = "Play";

  audio.ontimeupdate = () => {
    update();
    if (!seeking && isFinite(audio.duration))
      seek.value = audio.currentTime / audio.duration * 100;
  };

  audio.onloadedmetadata = () => {
    seek.disabled = !isFinite(audio.duration);
    update();
  };

  seek.oninput = e => {
    seeking = true;
    audio.currentTime = e.target.value / 100 * audio.duration;
  };
  seek.onchange = () => seeking = false;
</script>

</body>
</html>
